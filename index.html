<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星際大戰 LEGO 蒐藏追蹤器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0f;color:#e0e0e0;font-family:'Segoe UI',sans-serif}
header{background:linear-gradient(135deg,#1a1a2e,#0f3460);padding:14px 20px 10px;border-bottom:2px solid #f5c518;text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(245,197,24,.2)}
h1{font-size:1.55em;color:#f5c518;letter-spacing:3px;text-transform:uppercase;text-shadow:0 0 20px rgba(245,197,24,.5)}
h1 span{color:#fff}
.stats-bar{display:flex;gap:10px;justify-content:center;margin:8px 0 5px;flex-wrap:wrap}
.stat{background:rgba(245,197,24,.1);border:1px solid rgba(245,197,24,.3);padding:4px 11px;border-radius:20px;font-size:.79em}
.stat b{color:#f5c518}
.progress-wrap{height:5px;background:#222;border-radius:3px;margin:5px auto 0;max-width:360px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,#f5c518,#ff9500);border-radius:3px;transition:width .4s}
.controls{background:#111;padding:8px 14px;display:flex;gap:7px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #1e1e1e;position:sticky;top:104px;z-index:99}
input[type=text]{background:#1a1a1a;border:1px solid #333;color:#fff;padding:6px 10px;border-radius:6px;font-size:.85em;flex:1;min-width:140px;outline:none}
input[type=text]:focus{border-color:#f5c518}
select{background:#1a1a1a;border:1px solid #333;color:#fff;padding:6px 9px;border-radius:6px;font-size:.84em;outline:none;cursor:pointer}
.btn{background:#1e1e1e;color:#aaa;border:1px solid #333;padding:6px 11px;border-radius:6px;font-size:.79em;cursor:pointer;white-space:nowrap;transition:all .15s}
.btn:hover{background:#2a2a2a;color:#fff}
.btn.active{background:#1a3a1a;color:#4caf50;border-color:#2a5a2a}
.btn.blue{background:#0d2040;color:#5ab4ff;border-color:#1a4060}
.btn.blue:hover{background:#1a3060}
.btn.blue.on{background:#1a4080;border-color:#4a9eff}
.btn.gold{background:#2a1e00;color:#f5c518;border-color:#4a3a00}
.btn.gold:hover{background:#3a2a00}
.btn.teal{background:#001e1e;color:#00d4aa;border-color:#00504a}
.btn.teal:hover{background:#003030}
.btn.red{background:#3a0000;color:#e55;border-color:#5a0000;margin-left:auto}
.btn.red:hover{background:#5a0000;color:#ff9090}
.stats-panel{background:#0d0d12;border-bottom:2px solid rgba(245,197,24,.4);display:none;max-height:75vh;overflow-y:auto}
.stats-panel.open{display:block}
.stats-inner{max-width:1000px;margin:0 auto;padding:14px}
.stats-tabs{display:flex;gap:6px;margin-bottom:12px;border-bottom:1px solid #1e1e1e;padding-bottom:8px;flex-wrap:wrap}
.tab-btn{background:none;border:none;color:#555;font-size:.82em;cursor:pointer;padding:5px 13px;border-radius:6px;transition:all .15s}
.tab-btn.active{background:#1a1a2e;color:#f5c518;border:1px solid rgba(245,197,24,.3)}
.stat-section{display:none}.stat-section.active{display:block}
.chart-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.chart-label{width:175px;font-size:.74em;color:#aaa;text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;justify-content:flex-end;gap:5px}
.chart-bars{flex:1;height:16px;background:#1a1a1a;border-radius:3px;position:relative;overflow:hidden}
.bar-total{position:absolute;height:100%;background:#2a2a3a;border-radius:3px}
.bar-owned{position:absolute;height:100%;background:linear-gradient(90deg,#1a4a1a,#4caf50);border-radius:3px}
.chart-info{width:90px;font-size:.71em;color:#666;text-align:right;flex-shrink:0}
.chart-info b{color:#4caf50}
.stats-title{color:#f5c518;font-size:.88em;font-weight:bold;margin-bottom:10px}
.cat-btn{position:absolute;top:5px;left:5px;background:rgba(0,0,0,.65);border:1px solid #333;border-radius:5px;padding:2px 6px;font-size:.7em;cursor:pointer;display:none;z-index:10;color:#ddd;line-height:1.4}
.cat-btn:hover{background:rgba(74,158,255,.3);border-color:#4a9eff}
.card:hover .cat-btn{display:block}
.cat-badge{font-size:.67em;padding:2px 8px;border-radius:10px;border:1px solid #444;margin:3px 0 2px;display:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.cat-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
#catPopup{display:none;position:fixed;z-index:400;background:#141428;border:1px solid #4a9eff;border-radius:10px;padding:10px;min-width:190px;max-width:230px;box-shadow:0 8px 30px rgba(0,0,0,.9)}
.cat-popup-title{font-size:.72em;color:#888;padding-bottom:6px;border-bottom:1px solid #222;margin-bottom:6px}
.cat-opt{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:5px;cursor:pointer;font-size:.8em;transition:background .12s}
.cat-opt:hover{background:#1a2a3a}
.cat-opt.assigned{background:#0a1e0a}
#catModal{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.75);align-items:center;justify-content:center}
.cat-modal-box{background:#141428;border:1px solid #f5c518;border-radius:12px;padding:20px;max-width:460px;width:92%;max-height:82vh;overflow-y:auto}
.cat-modal-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #1a1a1a}
.cat-name-inp{flex:1;background:#0d0d1a;border:1px solid #333;color:#fff;padding:4px 8px;border-radius:5px;font-size:.82em;outline:none}
.cat-name-inp:focus{border-color:#f5c518}
.select-mode .card{cursor:crosshair}
.card.selected{border-color:#2196f3!important;box-shadow:0 0 0 2px #2196f3!important}
.card.selected .owned-badge{background:#2196f3!important}
.select-bar{display:none;position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0f1a30;border:1px solid #4a9eff;border-radius:12px;padding:10px 18px;gap:9px;align-items:center;z-index:300;box-shadow:0 6px 30px rgba(0,0,0,.85);white-space:nowrap}
.select-bar.show{display:flex}
.sel-count{color:#f5c518;font-weight:bold;font-size:.86em;min-width:65px}
.content{padding:12px 16px;max-width:1600px;margin:0 auto}
.year-section{margin-bottom:13px}
.year-header{display:flex;align-items:center;gap:8px;padding:5px 2px;border-bottom:1px solid #1e1e1e;margin-bottom:7px}
.year-label{color:#f5c518;font-weight:bold;font-size:.93em}
.year-count{background:rgba(245,197,24,.12);border:1px solid rgba(245,197,24,.25);color:#f5c518;font-size:.69em;padding:1px 7px;border-radius:10px}
.year-owned-label{font-size:.72em;color:#4caf50}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px}
.card{background:#111;border:1px solid #222;border-radius:8px;overflow:hidden;cursor:pointer;transition:all .15s;position:relative}
.card:hover{border-color:#444;transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.5)}
.card.owned{border-color:#2a5c2a;box-shadow:0 0 0 1px #2a5c2a}
.card-img{width:100%;aspect-ratio:1;object-fit:contain;background:#0d0d0d;display:block;padding:4px}
.card-img-ph{width:100%;aspect-ratio:1;background:#0d0d0d;display:flex;align-items:center;justify-content:center;color:#222;font-size:2em}
.card-body{padding:6px 8px 8px}
.card-num{font-size:.7em;color:#f5c518;font-weight:bold;margin-bottom:2px}
.card.owned .card-num{color:#4caf50}
.card-name{font-size:.75em;color:#ccc;line-height:1.3}
.card-meta{display:flex;justify-content:space-between;align-items:flex-end;margin-top:3px;gap:4px}
.card-parts{font-size:.65em;color:#555}
.card-prices{text-align:right;line-height:1.4}
.card-twd{font-size:.75em;color:#f5c518;font-weight:bold}
.card.owned .card-twd{color:#4caf50}
.card-ppc{font-size:.64em;color:#555}
.owned-badge{position:absolute;top:5px;right:5px;background:#4caf50;border-radius:50%;width:20px;height:20px;display:none;align-items:center;justify-content:center;font-size:12px;font-weight:bold;z-index:5}
.card.owned .owned-badge{display:flex}
.no-results{text-align:center;color:#333;padding:60px 20px;font-size:1em}
footer{text-align:center;padding:14px;color:#2a2a2a;font-size:.69em;border-top:1px solid #111;margin-top:10px}
@media (max-width: 700px) {
  header { padding: 10px 12px 8px; position: relative; }
  h1 { font-size: 1.05em; letter-spacing: 1px; }
  .stats-bar { gap: 5px; margin: 6px 0 4px; }
  .stat { font-size: .69em; padding: 3px 7px; }
  .progress-wrap { max-width: 100%; }
  .controls {
    position: relative; top: auto;
    padding: 7px 10px;
    gap: 5px;
  }
  .controls input[type=text] {
    flex: unset; width: 100%; order: -2;
    font-size: .9em; padding: 8px 12px;
  }
  .controls select { font-size: .82em; padding: 7px 7px; flex: 1; }
  .btn { padding: 8px 10px; font-size: .79em; }
  .btn.red { margin-left: 0; }
  .grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .card-img { padding: 3px; }
  .card-body { padding: 5px 7px 7px; }
  .card-num { font-size: .68em; }
  .card-name { font-size: .72em; }
  .card-twd { font-size: .72em; }
  .card-ppc { font-size: .62em; }
  .card-parts { font-size: .62em; }
  .card-meta { margin-top: 2px; }
  .owned-badge { width: 18px; height: 18px; font-size: 10px; }
  .cat-btn { font-size: .65em; padding: 2px 5px; }
  .year-label { font-size: .88em; }
  .content { padding: 8px 10px; }
  .stats-inner { padding: 10px; }
  .stats-tabs { gap: 4px; }
  .tab-btn { font-size: .76em; padding: 5px 10px; }
  .chart-label { width: 120px; font-size: .7em; }
  .chart-bars { height: 14px; }
  .chart-info { width: 70px; font-size: .68em; }
  .select-bar { width: 95%; flex-wrap: wrap; justify-content: center; bottom: 8px; padding: 8px 12px; gap: 6px; }
  .sel-count { width: 100%; text-align: center; }
  .cat-modal-box { padding: 14px; max-height: 90vh; }
  #catPopup { min-width: 160px; max-width: 90vw; }
  footer { font-size: .65em; padding: 10px; }
}
@media (max-width: 400px) {
  h1 { font-size: .95em; }
  .stat { font-size: .65em; padding: 2px 6px; }
  .grid { gap: 5px; }
  .card-name { font-size: .68em; }
}
</style>
</head>
<body>
<header>
  <h1>&#9733; <span>LEGO</span> 星際大戰 <span>蒐藏追蹤器</span> &#9733;</h1>
  <div class="stats-bar">
    <div class="stat">總計 <b id="sTotal">977</b> 套</div>
    <div class="stat">已擁有 <b id="sOwned" style="color:#4caf50">0</b> 套</div>
    <div class="stat">未擁有 <b id="sMissing" style="color:#e74c3c">977</b> 套</div>
    <div class="stat">完成度 <b id="sPct">0%</b></div>
    <div class="stat">已擁有總價 <b id="sValue" style="color:#f5c518">NT$0</b></div>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
</header>

<div class="stats-panel" id="statsPanel">
  <div class="stats-inner">
    <div class="stats-tabs">
      <button class="tab-btn active" onclick="showTab('Year',this)">📅 歷年</button>
      <button class="tab-btn" onclick="showTab('Saga',this)">🎬 各系列</button>
      <button class="tab-btn" onclick="showTab('Cat',this)">🏷 自訂分類</button>
    </div>
    <div class="stat-section active" id="tabYear"></div>
    <div class="stat-section" id="tabSaga"></div>
    <div class="stat-section" id="tabCat"></div>
  </div>
</div>

<div class="controls">
  <input type="text" id="searchBox" placeholder="🔍 搜尋編號或名稱..." oninput="applyFilter()">
  <select id="yearSel" onchange="applyFilter()"><option value="">全部年份</option></select>
  <select id="catFilter" onchange="applyFilter()" style="color:#00d4aa;border-color:#00504a"><option value="">全部分類</option><option value="__nc__">未分類</option></select><button class="btn" id="catClearBtn" onclick="clearCatFilter()" style="display:none;padding:5px 8px;color:#00d4aa;border-color:#00504a;font-size:.75em">✕ 清除分類篩選</button>
  <select id="sortSel" onchange="applyFilter()">
    <option value="default">排序：年份</option>
    <option value="price_asc">價格：低→高</option>
    <option value="price_desc">價格：高→低</option>
    <option value="ppc_asc">每片：低→高</option>
    <option value="ppc_desc">每片：高→低</option>
    <option value="parts_desc">零件數：多→少</option>
    <option value="name">名稱 A-Z</option>
  </select>
  <button class="btn active" id="bAll" onclick="setView('all')">全部</button>
  <button class="btn" id="bMissing" onclick="setView('missing')">未擁有</button>
  <button class="btn" id="bOwned" onclick="setView('owned')">已擁有</button>
  <button class="btn blue" id="btnSel" onclick="toggleSelMode()">☑ 批量</button>
  <button class="btn gold" onclick="toggleStats()">📊 統計</button>
  <button class="btn teal" onclick="showCatModal()">🏷 管理分類</button>
  <button class="btn" onclick="exportData()">⬇ 匯出</button>
  <label class="btn" style="cursor:pointer">⬆ 匯入<input type="file" accept=".json" onchange="importData(event)" style="display:none"></label>
  <button class="btn red" onclick="if(confirm('確定清除全部？'))resetAll()">清除全部</button>
</div>

<div id="catPopup">
  <div class="cat-popup-title">歸入分類</div>
  <div id="catPopupList"></div>
  <div style="border-top:1px solid #222;margin-top:6px;padding-top:7px">
    <div id="popupNewBox" style="display:none;margin-bottom:5px">
      <input type="text" id="popupNewName" placeholder="新分類名稱" style="width:100%;background:#0d0d1a;border:1px solid #333;color:#fff;padding:5px 8px;border-radius:5px;font-size:.8em;outline:none;margin-bottom:4px" onkeydown="if(event.key==='Enter')createCatFromPopup()">
      <button class="btn" style="width:100%;font-size:.77em;padding:4px;color:#4caf50;border-color:#2a5a2a" onclick="createCatFromPopup()">確定新增</button>
    </div>
    <button class="btn" style="width:100%;font-size:.77em;padding:4px;color:#4a9eff;border-color:#1a4060" onclick="document.getElementById('popupNewBox').style.display='block';document.getElementById('popupNewName').focus()">＋ 新增分類</button>
  </div>
</div>

<div id="catModal" style="display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.75);align-items:center;justify-content:center">
  <div class="cat-modal-box">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <h3 style="color:#f5c518;font-size:.95em">🏷 管理自訂分類</h3>
      <button class="btn" style="padding:2px 9px" onclick="hideCatModal()">✕</button>
    </div>
    <div style="font-size:.75em;color:#555;margin-bottom:10px">點色點可換色 ・ 可直接編輯名稱 ・ 在卡片上點 🏷 可歸類</div>
    <div id="catModalBody"></div>
    <div style="border-top:1px solid #222;margin-top:12px;padding-top:12px;display:flex;gap:8px">
      <input type="text" id="newCatNameModal" placeholder="新分類名稱..." style="flex:1;background:#0d0d1a;border:1px solid #333;color:#fff;padding:6px 10px;border-radius:6px;font-size:.83em;outline:none" onkeydown="if(event.key==='Enter'){createCatModal();this.value=''}">
      <button class="btn teal" style="font-size:.8em" onclick="createCatModal()">＋ 新增</button>
    </div>
  </div>
</div>

<div class="select-bar" id="selectBar">
  <span class="sel-count"><b id="selCount">0</b> 套已選</span>
  <button class="btn" onclick="selectAllVisible()">全選目前</button>
  <button class="btn" onclick="clearSel()">取消全選</button>
  <button class="btn active" onclick="markSel(true)">✓ 已擁有</button>
  <button class="btn" style="background:#3a0000;color:#e55;border-color:#5a0000;margin:0" onclick="markSel(false)">✗ 未擁有</button>
  <button class="btn blue" onclick="assignSelToCat()">🏷 批量歸類</button>
  <button class="btn" onclick="toggleSelMode()">離開</button>
</div>

<div class="content" id="content"></div>
<footer>資料來源：Rebrickable &amp; Bricker.asia｜匯率 1 USD = 31.88 TWD｜進度儲存於瀏覽器本機</footer>

let owned   = new Set(JSON.parse(localStorage.getItem('sw_lego_owned')  ||'[]'));
let cats    = JSON.parse(localStorage.getItem('sw_lego_cats')    ||'{}');
let setCats = JSON.parse(localStorage.getItem('sw_lego_setcats') ||'{}');
let view='all',selMode=false,selected=new Set(),statsOpen=false,activeTab='Year',catPopupTarget=null;

function save(){localStorage.setItem('sw_lego_owned',JSON.stringify([...owned]));updateStats();}
function saveCats(){
  localStorage.setItem('sw_lego_cats',   JSON.stringify(cats));
  localStorage.setItem('sw_lego_setcats',JSON.stringify(setCats));
  refreshCatFilter();
}

function updateStats(){
  const n=owned.size,t=SETS.length,p=Math.round(n/t*100);
  document.getElementById('sOwned').textContent=n;
  document.getElementById('sMissing').textContent=t-n;
  document.getElementById('sPct').textContent=p+'%';
  document.getElementById('progressBar').style.width=p+'%';
  const usd=SETS.filter(s=>owned.has(s.num)&&s.price).reduce((a,s)=>a+s.price,0);
  document.getElementById('sValue').textContent='NT$'+Math.round(usd*USD_TWD).toLocaleString();
  refreshYearLabels();
  if(statsOpen)renderStatsTab();
}
function refreshYearLabels(){
  document.querySelectorAll('.year-section').forEach(sec=>{
    const o=sec.querySelectorAll('.card.owned').length,t=sec.querySelectorAll('.card').length;
    sec.querySelector('.year-owned-label').textContent=o+'/'+t;
  });
}

function handleCardClick(num,card){if(selMode)toggleSel(num,card);else toggleOwn(num,card);}
function toggleOwn(num,card){
  if(owned.has(num)){owned.delete(num);card.classList.remove('owned');}
  else{owned.add(num);card.classList.add('owned');}
  save();
}

function toggleSelMode(){
  selMode=!selMode;selected.clear();
  document.querySelectorAll('.card.selected').forEach(c=>c.classList.remove('selected'));
  document.body.classList.toggle('select-mode',selMode);
  document.getElementById('selectBar').classList.toggle('show',selMode);
  document.getElementById('btnSel').classList.toggle('on',selMode);
  updateSelCount();
}
function toggleSel(num,card){
  if(selected.has(num)){selected.delete(num);card.classList.remove('selected');}
  else{selected.add(num);card.classList.add('selected');}
  updateSelCount();
}
function updateSelCount(){document.getElementById('selCount').textContent=selected.size;}
function selectAllVisible(){
  document.querySelectorAll('.card').forEach(c=>{if(c.style.display==='none')return;selected.add(c.dataset.num);c.classList.add('selected');});
  updateSelCount();
}
function clearSel(){selected.clear();document.querySelectorAll('.card.selected').forEach(c=>c.classList.remove('selected'));updateSelCount();}
function markSel(asOwned){
  selected.forEach(num=>{if(asOwned)owned.add(num);else owned.delete(num);});
  document.querySelectorAll('.card').forEach(c=>{if(selected.has(c.dataset.num))c.classList.toggle('owned',asOwned);});
  save();toggleSelMode();
}
function assignSelToCat(){
  if(!selected.size){alert('請先選取套組');return;}
  const keys=Object.keys(cats);
  if(!keys.length){alert('請先建立分類（點「管理分類」）');return;}
  const opts=keys.map((id,i)=>(i+1)+'. '+cats[id].name).join('\n');
  const ans=prompt('選擇分類編號（輸入 0 移除分類）:\n'+opts);
  if(ans===null)return;
  const idx=parseInt(ans)-1;
  selected.forEach(num=>{
    if(ans==='0'||idx<0){delete setCats[num];}
    else if(keys[idx]){setCats[num]=keys[idx];}
    updateCardCatBadge(num);
  });
  saveCats();toggleSelMode();
}

function showCatPopup(setNum,e){
  e.stopPropagation();catPopupTarget=setNum;
  document.getElementById('popupNewBox').style.display='none';
  document.getElementById('popupNewName').value='';
  renderCatPopupList();
  const p=document.getElementById('catPopup'),r=e.currentTarget.getBoundingClientRect();
  p.style.left=Math.min(r.left,window.innerWidth-240)+'px';
  p.style.top=Math.min(r.bottom+4,window.innerHeight-320)+'px';
  p.style.display='block';
}
function hideCatPopup(){document.getElementById('catPopup').style.display='none';catPopupTarget=null;}
function renderCatPopupList(){
  if(!catPopupTarget)return;
  const cur=setCats[catPopupTarget],el=document.getElementById('catPopupList'),keys=Object.keys(cats);
  if(!keys.length){el.innerHTML='<div style="color:#555;padding:4px 2px;font-size:.78em">尚無分類</div>';return;}
  el.innerHTML=keys.map(id=>{
    const c=cats[id],a=cur===id;
    return '<div class="cat-opt'+(a?' assigned':'')+'" onclick="toggleSetCat(\''+id+'\');renderCatPopupList()">'
      +'<span class="cat-dot" style="background:'+c.color+'"></span><span style="flex:1">'+c.name+'</span>'
      +(a?'<span style="color:#4caf50">✓</span>':'')+'</div>';
  }).join('')+(cur?'<div class="cat-opt" style="color:#777;border-top:1px solid #1a1a1a;margin-top:4px;padding-top:5px" onclick="removeSetCat();renderCatPopupList()">✕ 移除分類</div>':'');
}
function toggleSetCat(catId){
  if(!catPopupTarget)return;
  if(setCats[catPopupTarget]===catId)delete setCats[catPopupTarget];else setCats[catPopupTarget]=catId;
  saveCats();updateCardCatBadge(catPopupTarget);if(statsOpen)renderStatsTab();
}
function removeSetCat(){
  if(!catPopupTarget)return;
  delete setCats[catPopupTarget];saveCats();updateCardCatBadge(catPopupTarget);
}
function createCatFromPopup(){
  const name=document.getElementById('popupNewName').value.trim();if(!name)return;
  const id=createCat(name);
  setCats[catPopupTarget]=id;saveCats();updateCardCatBadge(catPopupTarget);
  document.getElementById('popupNewBox').style.display='none';
  document.getElementById('popupNewName').value='';
  renderCatPopupList();
}
function updateCardCatBadge(num){
  document.querySelectorAll('.card[data-num="'+num+'"] .cat-badge').forEach(badge=>{
    const catId=setCats[num];
    if(catId&&cats[catId]){
      const c=cats[catId];
      badge.textContent=c.name;badge.dataset.cat=catId;
      badge.style.background=c.color+'22';badge.style.borderColor=c.color;badge.style.color=c.color;
      badge.style.display='block';
    }else{badge.style.display='none';delete badge.dataset.cat;}
  });
}
function refreshCatFilter(){
  const sel=document.getElementById('catFilter'),val=sel.value;
  sel.innerHTML='<option value="">全部分類</option><option value="__nc__">未分類</option>';
  Object.keys(cats).forEach(id=>{const o=document.createElement('option');o.value=id;o.textContent=cats[id].name;sel.appendChild(o);});
  sel.value=val;
}

function createCat(name){
  const id='c'+Date.now(),color=CAT_COLORS[Object.keys(cats).length%CAT_COLORS.length];
  cats[id]={name:name,color:color};saveCats();return id;
}
function deleteCat(id){
  if(!confirm('確定刪除「'+cats[id].name+'」？'))return;
  delete cats[id];
  Object.keys(setCats).forEach(n=>{if(setCats[n]===id)delete setCats[n];});
  saveCats();
  document.querySelectorAll('.cat-badge[data-cat="'+id+'"]').forEach(b=>{b.style.display='none';delete b.dataset.cat;});
  renderCatModal();
}
function renameCat(id,name){
  if(!name.trim())return;cats[id].name=name.trim();saveCats();
  document.querySelectorAll('.cat-badge[data-cat="'+id+'"]').forEach(b=>b.textContent=cats[id].name);
}
function cycleCatColor(id){
  const idx=CAT_COLORS.indexOf(cats[id].color);
  cats[id].color=CAT_COLORS[(idx+1)%CAT_COLORS.length];saveCats();
  document.querySelectorAll('.cat-badge[data-cat="'+id+'"]').forEach(b=>{
    b.style.background=cats[id].color+'22';b.style.borderColor=cats[id].color;b.style.color=cats[id].color;
  });
  renderCatModal();
}
function showCatModal(){renderCatModal();document.getElementById('catModal').style.display='flex';}
function hideCatModal(){document.getElementById('catModal').style.display='none';}
function renderCatModal(){
  const el=document.getElementById('catModalBody'),keys=Object.keys(cats);
  if(!keys.length){el.innerHTML='<div style="color:#555;padding:12px;text-align:center;font-size:.83em">尚無分類，請在下方新增</div>';return;}
  el.innerHTML=keys.map(id=>{
    const c=cats[id],cnt=Object.values(setCats).filter(v=>v===id).length;
    return '<div class="cat-modal-row">'
      +'<span class="cat-dot" style="background:'+c.color+';cursor:pointer;width:14px;height:14px" onclick="cycleCatColor(\''+id+'\')" title="點擊換色"></span>'
      +'<input class="cat-name-inp" value="'+c.name.replace(/"/g,'&quot;')+'" onchange="renameCat(\''+id+'\',this.value)">'
      +'<span style="color:#555;font-size:.72em;white-space:nowrap">'+cnt+' 套</span>'
      +'<button class="btn" style="padding:2px 8px;font-size:.73em;color:#e55;border-color:#5a0000;margin:0" onclick="deleteCat(\''+id+'\')">刪除</button>'
      +'</div>';
  }).join('');
}
function createCatModal(){
  const inp=document.getElementById('newCatNameModal');
  if(!inp.value.trim())return;createCat(inp.value.trim());inp.value='';renderCatModal();
}

function toggleStats(){
  statsOpen=!statsOpen;
  document.getElementById('statsPanel').classList.toggle('open',statsOpen);
  if(statsOpen)renderStatsTab();
}
function showTab(t,btn){
  activeTab=t;
  document.querySelectorAll('.stat-section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab'+t).classList.add('active');
  if(btn)btn.classList.add('active');
  renderStatsTab();
}
function renderStatsTab(){
  if(activeTab==='Year')renderYearChart();
  else if(activeTab==='Saga')renderSagaChart();
  else renderCatChart();
}
function chartRow(label,t,o,maxT,color,ownedColor){
  const pT=t/maxT*100,pO=t?o/maxT*100:0,pct=t?Math.round(o/t*100):0;
  return '<div class="chart-row">'
    +'<div class="chart-label">'+(color?'<span class="cat-dot" style="background:'+color+'"></span>':'')+label+'</div>'
    +'<div class="chart-bars"><div class="bar-total" style="width:'+pT+'%"></div>'
    +'<div class="bar-owned" style="width:'+pO+'%;'+(ownedColor?'background:'+ownedColor+';':'')+'"></div></div>'
    +'<div class="chart-info"><b>'+o+'</b>/'+t+' ('+pct+'%)</div></div>';
}
function renderYearChart(){
  const el=document.getElementById('tabYear'),byY={};
  SETS.forEach(s=>{(byY[s.year]||(byY[s.year]={t:0,o:0}));byY[s.year].t++;if(owned.has(s.num))byY[s.year].o++;});
  const yrs=Object.keys(byY).sort((a,b)=>a-b),maxT=Math.max(...yrs.map(y=>byY[y].t));
  el.innerHTML='<div class="stats-title">歷年套組分布（'+yrs.length+' 年）</div>'+yrs.map(y=>chartRow(y,byY[y].t,byY[y].o,maxT,null,null)).join('');
}
function renderSagaChart(){
  const el=document.getElementById('tabSaga'),bS={};
  SAGAS.forEach(s=>bS[s.k]={l:s.l,t:0,o:0});
  SETS.forEach(s=>{const k=getSaga(s.name);bS[k].t++;if(owned.has(s.num))bS[k].o++;});
  const rows=SAGAS.map(s=>({...s,...bS[s.k]})).filter(r=>r.t>0);
  const maxT=Math.max(...rows.map(r=>r.t));
  el.innerHTML='<div class="stats-title">各系列分布</div>'+rows.map(r=>chartRow(r.l,r.t,r.o,maxT,null,null)).join('');
}
function renderCatChart(){
  const el=document.getElementById('tabCat'),keys=Object.keys(cats);
  if(!keys.length){el.innerHTML='<div style="color:#555;padding:20px;text-align:center;font-size:.85em">尚未建立自訂分類。<br>在卡片上點 🏷 按鈕即可建立並歸類。</div>';return;}
  const bC={__nc__:{l:'未分類',t:0,o:0,color:'#444'}};
  keys.forEach(id=>bC[id]={l:cats[id].name,t:0,o:0,color:cats[id].color});
  SETS.forEach(s=>{const k=(setCats[s.num]&&cats[setCats[s.num]])?setCats[s.num]:'__nc__';bC[k].t++;if(owned.has(s.num))bC[k].o++;});
  const rows=Object.keys(bC).filter(k=>bC[k].t>0).sort((a,b)=>a==='__nc__'?1:b==='__nc__'?-1:bC[b].t-bC[a].t);
  const maxT=Math.max(...rows.map(k=>bC[k].t));
  el.innerHTML='<div class="stats-title">自訂分類分布（'+keys.length+' 個分類）</div>'+rows.map(k=>chartRow(bC[k].l,bC[k].t,bC[k].o,maxT,bC[k].color,bC[k].color+'aa')).join('');
}

function clearCatFilter(){
  document.getElementById('catFilter').value='';
  document.getElementById('catClearBtn').style.display='none';
  applyFilter();
}
function filterByCat(catId){
  const sel=document.getElementById('catFilter');
  sel.value=catId;
  setView('all');
  applyFilter();
  // scroll to top of content
  document.getElementById('content').scrollIntoView({behavior:'smooth'});
}
function setView(v){
  view=v;
  ['bAll','bMissing','bOwned'].forEach(id=>document.getElementById(id).classList.remove('active'));
  document.getElementById(v==='all'?'bAll':v==='missing'?'bMissing':'bOwned').classList.add('active');
  applyFilter();
}
function sortSets(sets){
  const s=[...sets],sort=document.getElementById('sortSel').value;
  const twd=x=>x.price?Math.round(x.price*USD_TWD):0;
  const ppc=x=>(x.price&&x.parts)?x.price*USD_TWD/x.parts:0;
  if(sort==='price_asc') return s.sort((a,b)=>twd(a)-twd(b));
  if(sort==='price_desc')return s.sort((a,b)=>twd(b)-twd(a));
  if(sort==='ppc_asc')   return s.sort((a,b)=>ppc(a)-ppc(b));
  if(sort==='ppc_desc')  return s.sort((a,b)=>ppc(b)-ppc(a));
  if(sort==='parts_desc')return s.sort((a,b)=>b.parts-a.parts);
  if(sort==='name')      return s.sort((a,b)=>a.name.localeCompare(b.name));
  return s;
}
function applyFilter(){
  const q=document.getElementById('searchBox').value.toLowerCase();
  const yr=document.getElementById('yearSel').value;
  const cf=document.getElementById('catFilter').value;
  const sort=document.getElementById('sortSel').value;
  const filtered=SETS.filter(s=>{
    const io=owned.has(s.num);
    if(q&&!s.num.toLowerCase().includes(q)&&!s.name.toLowerCase().includes(q))return false;
    if(yr&&String(s.year)!==yr)return false;
    if(view==='owned'&&!io)return false;
    if(view==='missing'&&io)return false;
    if(cf==='__nc__'&&setCats[s.num])return false;
    if(cf&&cf!=='__nc__'&&setCats[s.num]!==cf)return false;
    return true;
  });
  const flat=document.getElementById('flatContent');
  if(sort!=='default'){
    document.querySelectorAll('.year-section').forEach(s=>s.style.display='none');
    if(!flat){const d=document.createElement('div');d.id='flatContent';document.getElementById('content').insertBefore(d,document.getElementById('noRes'));}
    document.getElementById('flatContent').innerHTML='';
    const g=document.createElement('div');g.className='grid';
    sortSets(filtered).forEach(s=>g.appendChild(makeCard(s)));
    document.getElementById('flatContent').appendChild(g);
  }else{
    if(flat)flat.remove();
    document.querySelectorAll('.year-section').forEach(sec=>{
      let vis=false;
      sec.querySelectorAll('.card').forEach(c=>{
        const io=owned.has(c.dataset.num);
        let show=true;
        if(q&&!c.dataset.num.toLowerCase().includes(q)&&!c.dataset.name.toLowerCase().includes(q))show=false;
        if(view==='owned'&&!io)show=false;
        if(view==='missing'&&io)show=false;
        if(cf==='__nc__'&&setCats[c.dataset.num])show=false;
        if(cf&&cf!=='__nc__'&&setCats[c.dataset.num]!==cf)show=false;
        c.style.display=show?'':'none';if(show)vis=true;
      });
      const ym=!yr||sec.dataset.year===yr;
      sec.style.display=(vis&&ym)?'':'none';
    });
  }
  document.getElementById('noRes').style.display=filtered.length?'none':'block';
  const cf2=document.getElementById('catFilter').value;
  document.getElementById('catClearBtn').style.display=cf2?'inline-block':'none';
  if(statsOpen)renderStatsTab();
}

function makeCard(s){
  const card=document.createElement('div');
  card.className='card'+(owned.has(s.num)?' owned':'');
  card.dataset.num=s.num;card.dataset.name=s.name;
  card.onclick=()=>handleCardClick(s.num,card);
  const twd=s.price?Math.round(s.price*USD_TWD):null;
  const ppc=(twd&&s.parts>0)?(twd/s.parts).toFixed(1):null;
  const priceBlock=twd
    ?'<div class="card-prices"><div class="card-twd">NT$'+twd.toLocaleString()+'</div><div class="card-ppc">每片 NT$'+ppc+'</div></div>'
    :'<div class="card-prices"><div class="card-twd" style="color:#333">—</div></div>';
  const imgHtml=s.img
    ?'<img class="card-img" src="'+s.img+'" loading="lazy" alt="" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'flex\'">'
      +'<div class="card-img-ph" style="display:none">🧱</div>'
    :'<div class="card-img-ph">🧱</div>';
  card.innerHTML=imgHtml
    +'<div class="owned-badge">&#10003;</div>'
    +'<button class="cat-btn" onclick="showCatPopup(\''+s.num+'\',event)">🏷</button>'
    +'<div class="card-body">'
    +'<div class="card-num">'+s.num+'</div>'
    +'<div class="card-name">'+s.name.replace(/</g,'&lt;')+'</div>'
    +'<div class="cat-badge"></div>'
    +'<div class="card-meta"><span class="card-parts">'+s.parts.toLocaleString()+' pcs</span>'+priceBlock+'</div>'
    +'</div>';
  const catId=setCats[s.num];
  if(catId&&cats[catId]){
    const c=cats[catId],b=card.querySelector('.cat-badge');
    b.textContent=c.name;b.dataset.cat=catId;
    b.style.background=c.color+'22';b.style.borderColor=c.color;b.style.color=c.color;
    b.style.display='block';b.style.cursor='pointer';b.title='點擊篩選此分類';
    b.onclick=function(e){e.stopPropagation();filterByCat(catId);};
  }
  return card;
}

function exportData(){
  const data={version:2,date:new Date().toISOString().slice(0,10),owned:[...owned].sort(),cats:cats,setCats:setCats};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='sw_lego_backup_'+data.date+'.json';a.click();URL.revokeObjectURL(a.href);
}
function importData(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const data=JSON.parse(ev.target.result);
      const list=data.owned||data;
      if(!Array.isArray(list))throw new Error('格式錯誤');
      const valid=new Set(SETS.map(s=>s.num));
      owned=new Set(list.filter(n=>valid.has(n)));
      if(data.cats)cats=data.cats;
      if(data.setCats)setCats=data.setCats;
      document.querySelectorAll('.card').forEach(c=>{c.classList.toggle('owned',owned.has(c.dataset.num));updateCardCatBadge(c.dataset.num);});
      save();saveCats();
      alert('匯入成功！已還原 '+owned.size+' 套 + '+Object.keys(cats).length+' 個分類。');
    }catch(err){alert('匯入失敗：'+err.message);}
    e.target.value='';
  };
  reader.readAsText(file);
}
function resetAll(){owned.clear();document.querySelectorAll('.card.owned').forEach(c=>c.classList.remove('owned'));save();}

document.addEventListener('touchstart',function(){},true);
document.addEventListener('click',function(e){
  const p=document.getElementById('catPopup');
  if(p.style.display!=='none'&&!p.contains(e.target))hideCatPopup();
});

function render(){
  const byY={};
  SETS.forEach(s=>{(byY[s.year]||(byY[s.year]=[])).push(s);});
  const yrSel=document.getElementById('yearSel');
  Object.keys(byY).sort((a,b)=>a-b).forEach(y=>{const o=document.createElement('option');o.value=y;o.textContent=y+'年';yrSel.appendChild(o);});
  refreshCatFilter();
  const content=document.getElementById('content');
  Object.keys(byY).sort((a,b)=>a-b).forEach(y=>{
    const sec=document.createElement('div');
    sec.className='year-section';sec.dataset.year=y;
    const sets=byY[y],on=sets.filter(s=>owned.has(s.num)).length;
    sec.innerHTML='<div class="year-header"><span class="year-label">'+y+' 年</span><span class="year-count">'+sets.length+' 套</span><span class="year-owned-label">'+on+'/'+sets.length+'</span></div><div class="grid"></div>';
    sets.forEach(s=>sec.querySelector('.grid').appendChild(makeCard(s)));
    content.appendChild(sec);
  });
  const noRes=document.createElement('div');
  noRes.id='noRes';noRes.className='no-results';noRes.style.display='none';
  noRes.textContent='找不到符合的套組';
  content.appendChild(noRes);
  updateStats();
}
render();
</script>
</body>
</html>
